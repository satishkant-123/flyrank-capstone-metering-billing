# FlyRank Capstone Manifest
run: npm start
seed: node src/db/seed.js
test: npm test
base_url: http://localhost:3000

endpoints:
  billable: POST /generate
  billable_v1: POST /api/v1/generate
  usage: GET /usage
  checkout: POST /checkout/create-session
  webhook: POST /webhooks/stripe
  invoices: GET /invoices
  health: GET /api/v1/health
  reconcile_job: POST /api/v1/jobs/reconcile
  alerts_job: POST /api/v1/jobs/alerts
